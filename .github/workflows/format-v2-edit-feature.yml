name: Format CF-EDIT feature Go
on:
  push:
    branches: [feature/v2-rust-guard-only]
permissions:
  contents: write
jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/v2-rust-guard-only
      - name: gofmt feature code
        run: gofmt -w fileserver/cf_v2_edit_agent.go fileserver/cf_v2_edit_agent_test.go
      - name: Commit formatting only
        run: |
          if ! git diff --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add fileserver/cf_v2_edit_agent.go fileserver/cf_v2_edit_agent_test.go
            git commit -m "style(cf-edit): gofmt guarded native agent transport"
            git push origin HEAD:feature/v2-rust-guard-only
          fi
