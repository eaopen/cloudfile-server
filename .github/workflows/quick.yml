name: CloudFile quick source checks

# Routine commits receive only cheap static checks; native builds, database,
# cross-repo tests and full Go lint require explicit workflow_dispatch.
on:
  push:
    branches: [dev]
  pull_request:
    branches: [dev]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  static:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Block retired managed-library code and contracts
        run: python3 tests/test_v2_no_managed_library.py

      - name: Check native directory/file batch kinds
        run: python3 tests/test_cf_acl_dirent_kind.py

      - name: Run cheap C-source ACL and Branch retry contracts
        run: python3 -m unittest discover -s tests -p 'test_cf_*.py'

      - name: Validate only changed source
        shell: bash
        run: |
          set -euo pipefail
          git diff --check HEAD^ HEAD
          python3 - <<'PY'
          from pathlib import Path
          import subprocess

          changed = subprocess.check_output(
              ['git', 'diff', '--name-only', '-z', 'HEAD^', 'HEAD']
          ).split(b'\0')
          for raw in changed:
              if not raw:
                  continue
              path = Path(raw.decode('utf-8'))
              if path.is_file() and path.suffix == '.py':
                  compile(path.read_bytes(), str(path), 'exec')
          PY
          while IFS= read -r path; do
            [[ ! -f "$path" ]] || bash -n "$path"
          done < <(git diff --name-only HEAD^ HEAD -- '*.sh')
          while IFS= read -r path; do
            if [[ -f "$path" ]]; then
              [[ -z "$(gofmt -l "$path")" ]] || {
                echo "Unformatted Go file: $path" >&2
                exit 1
              }
            fi
          done < <(git diff --name-only HEAD^ HEAD -- '*.go')

  uuid-v2-atomic-proof:
    if: github.event_name == 'pull_request' && github.event.pull_request.head.ref == 'fix/v2-uuid-only-storage-20261024'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Test native C UUID route and both SQL fault points
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libglib2.0-dev libjansson-dev pkg-config
          bash tests/local_storage/run.sh
      - uses: actions/setup-go@v5
        with:
          go-version-file: fileserver/go.mod
          cache-dependency-path: fileserver/go.sum
      - name: Test Go V2 object route
        working-directory: fileserver
        run: go test ./objstore -run '^TestV2' -count=1
